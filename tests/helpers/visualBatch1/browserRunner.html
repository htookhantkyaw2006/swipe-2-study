<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch 1 Visual & Interaction Verification Runner</title>
  <link rel="preload" href="/fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/src/index.css" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; }
    #root { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { createElement, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { MemoryRouter, Routes, Route } from 'react-router-dom';
    import { AuthProvider } from '/src/lib/auth.jsx';
    import StorageOwnerBoundary from '/src/components/StorageOwnerBoundary.jsx';
    import { LanguageProvider } from '/src/lib/language.jsx';
    import { PreferencesProvider } from '/src/lib/preferences.jsx';
    import { PublishedContentProvider } from '/src/lib/publishedContentContext.jsx';
    import GuestImportProvider from '/src/components/GuestImportProvider.jsx';
    import { GuestImportContext } from '/src/lib/guestImportContext.js';
    import Layout from '/src/components/Layout.jsx';
    import Home from '/src/pages/Home.jsx';
    import LevelPicker from '/src/pages/Learn/LevelPicker.jsx';
    import LessonPicker from '/src/pages/Learn/LessonPicker.jsx';
    import SwipeSession from '/src/pages/Learn/SwipeSession.jsx';
    import ReviewWords from '/src/pages/Learn/ReviewWords.jsx';
    import SavedWords from '/src/pages/SavedWords.jsx';
    import Library from '/src/pages/Library.jsx';
    import Profile from '/src/pages/Profile.jsx';
    import SettingsSubpage from '/src/pages/SettingsSubpage.jsx';
    import Flashcards from '/src/pages/Flashcards.jsx';
    import PhrasesLevel from '/src/pages/PhrasesLevel.jsx';
    import PhrasesSwipeSession from '/src/pages/PhrasesSwipeSession.jsx';
    import LearnKana from '/src/pages/LearnKana.jsx';
    import LearnSounds from '/src/pages/LearnSounds.jsx';
    import LearnRadicals from '/src/pages/LearnRadicals.jsx';
    import WritingPractice from '/src/pages/WritingPractice.jsx';
    import Dictionary from '/src/pages/Dictionary.jsx';
    import Premium from '/src/pages/Premium.jsx';
    import StudyByInterest from '/src/pages/StudyByInterest.jsx';
    import Notifications from '/src/pages/Notifications.jsx';
    import EditProfile from '/src/pages/EditProfile.jsx';
    import Login from '/src/pages/Login.jsx';
    import Signup from '/src/pages/Signup.jsx';
    import ForgotPassword from '/src/pages/ForgotPassword.jsx';
    import ResetPassword from '/src/pages/ResetPassword.jsx';
    import { AuthContext } from '/src/lib/authContext.js';
    import { storageOwner } from '/src/lib/storageOwner.js';
    import { getSupabaseClient, setSupabaseClient } from '/src/lib/supabase.js';
    import { db } from '/src/lib/db.js';
    import { setActiveLanguageId } from '/src/lib/activeLanguage.js';

    const rootElement = document.getElementById('root');
    let reactRoot = null;
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    window.addEventListener('error', (e) => console.error('WINDOW ERROR:', e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => console.error('UNHANDLED REJECTION:', e.reason));

    async function waitFor(condition, timeoutMs = 4000, label = 'unnamed', intervalMs = 30) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        try {
          if (condition()) return;
        } catch {}
        await sleep(intervalMs);
      }
      const root = document.getElementById('root');
      throw new Error(`waitFor[${label}] timed out after ${timeoutMs}ms. Root: ` + (root ? root.innerHTML.slice(0, 500) : 'no root'));
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }

    async function loadHsk1Items() {
      const res = await fetch('/api/hsk1-items');
      if (!res.ok) throw new Error('Failed to fetch /api/hsk1-items');
      return await res.json();
    }

    async function loadN5Items() {
      try {
        const res = await fetch('/api/n5-items');
        if (!res.ok) return [];
        return await res.json();
      } catch {
        return [];
      }
    }

    function AppTestWrapper({ initialEntries, hsk1Items, n5Items = [], publishedEnabled = true, authValue = null }) {
      const initialCache = {
        'zh-hsk1': {
          status: 'loaded',
          items: hsk1Items,
          version: 1,
          error: null,
          isPublished: true,
        },
        'ja-n5': {
          status: 'loaded',
          items: n5Items,
          version: 1,
          error: null,
          isPublished: true,
        },
      };

      const mockGuestImportService = {
        inspect: async () => ({ status: 'none', count: 0 }),
        subscribe: () => () => {},
        choose: async () => {},
        dismissNotice: () => {},
        getOffer: () => null,
      };

      const inner = createElement(
        StorageOwnerBoundary,
        null,
        createElement(
          PreferencesProvider,
          null,
          createElement(
            LanguageProvider,
            null,
            createElement(
              MemoryRouter,
              { initialEntries },
              createElement(
                authValue ? GuestImportContext.Provider : GuestImportProvider,
                authValue
                  ? {
                      value: {
                        available: true,
                        checking: false,
                        pending: false,
                        notice: null,
                        openGuestImport: () => {},
                        dismissNotice: () => {},
                      },
                    }
                  : null,
                createElement(
                  PublishedContentProvider,
                  { enabledOverride: publishedEnabled, initialCache },
                  createElement(
                    Routes,
                    null,
                    createElement(Route, { path: '/login', element: createElement(Login) }),
                    createElement(Route, { path: '/signup', element: createElement(Signup) }),
                    createElement(Route, { path: '/forgot-password', element: createElement(ForgotPassword) }),
                    createElement(Route, { path: '/reset-password', element: createElement(ResetPassword) }),
                    createElement(
                      Route,
                      { path: '/', element: createElement(Layout) },
                      createElement(Route, { index: true, element: createElement(Home) }),
                      createElement(Route, { path: 'learn', element: createElement(LevelPicker) }),
                      createElement(Route, { path: 'learn/level/:levelId', element: createElement(LessonPicker) }),
                      createElement(Route, { path: 'learn/session', element: createElement(SwipeSession) }),
                      createElement(Route, { path: 'learn/review', element: createElement(ReviewWords) }),
                      createElement(Route, { path: 'learn/review/session', element: createElement(SwipeSession, { isReview: true }) }),
                      createElement(Route, { path: 'saved', element: createElement(SavedWords) }),
                      createElement(Route, { path: 'saved/session', element: createElement(SwipeSession, { isSaved: true }) }),
                      createElement(Route, { path: 'library', element: createElement(Library) }),
                      createElement(Route, { path: 'profile', element: createElement(Profile) }),
                      createElement(Route, { path: 'settings', element: createElement(SettingsSubpage) }),
                      createElement(Route, { path: 'flashcards', element: createElement(Flashcards) }),
                      createElement(Route, { path: 'flashcards/level/:levelId', element: createElement(PhrasesLevel) }),
                      createElement(Route, { path: 'flashcards/session', element: createElement(PhrasesSwipeSession) }),
                      createElement(Route, { path: 'kana', element: createElement(LearnKana) }),
                      createElement(Route, { path: 'sounds', element: createElement(LearnSounds) }),
                      createElement(Route, { path: 'radicals', element: createElement(LearnRadicals) }),
                      createElement(Route, { path: 'writing', element: createElement(WritingPractice) }),
                      createElement(Route, { path: 'dictionary', element: createElement(Dictionary) }),
                      createElement(Route, { path: 'interest', element: createElement(StudyByInterest) }),
                      createElement(Route, { path: 'notifications', element: createElement(Notifications) }),
                      createElement(Route, { path: 'profile/edit', element: createElement(EditProfile) }),
                      createElement(Route, { path: 'premium', element: createElement(Premium) })
                    )
                  )
                )
              )
            )
          )
        )
      );

      if (authValue) {
        return createElement(AuthContext.Provider, { value: authValue }, inner);
      }

      return createElement(AuthProvider, null, inner);
    }

    function setReactInputValue(input, val) {
      const descriptor = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
      descriptor.set.call(input, val);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function renderTree(ui) {
      if (!reactRoot) reactRoot = createRoot(rootElement);
      reactRoot.render(ui);
    }

    function unmountTree() {
      if (reactRoot) {
        reactRoot.unmount();
        reactRoot = null;
        rootElement.innerHTML = '';
      }
    }

    async function runVerification() {
      const results = [];
      const hsk1Items = await loadHsk1Items();
      const n5Items = await loadN5Items();
      assert(hsk1Items.length === 300, `Expected 300 HSK1 items, received ${hsk1Items.length}`);
      assert(n5Items.length === 706, `Expected 706 N5 items, received ${n5Items.length}`);

      // Reset storage for clean test run
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      // -----------------------------------------------------------------------
      // Step 1: Verify Home Page ('/')
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/'], hsk1Items, n5Items }));
      await waitFor(() => document.querySelector('.home-page') !== null && document.querySelector('.course-badge') !== null, 4000, 'step1-home-page');

      // Verify Greeting and Identity
      const homeGreeting = document.querySelector('.home-greeting');
      assert(homeGreeting !== null, 'Home greeting is mounted');
      assert(document.body.textContent.includes('Guest Learner') || document.body.textContent.includes('Welcome'), 'Greets user');

      // Verify Level Carousel and Active Level Badge
      const courseBadge = document.querySelector('.course-badge');
      assert(courseBadge !== null, 'Course badge is present in LevelCarousel');
      assert(courseBadge.textContent.includes('NOW LEARNING'), 'Active level displays NOW LEARNING badge');

      // Verify Active Level Content & honest completion
      assert(document.body.textContent.includes('HSK 1'), 'Displays HSK 1 title');
      assert(document.body.textContent.includes('0 / 300 completed'), 'Hero displays honest completion: 0 / 300 completed');

      // Verify Level Actions
      assert(document.body.textContent.includes('Start swiping') || document.body.textContent.includes('Start learning'), 'Primary CTA is present');
      assert(document.body.textContent.includes('Overview'), 'Overview button is present');
      assert(document.body.textContent.includes('All levels'), 'All levels button is present');

      // Verify Quick Action Tiles: Review & Saved
      assert(document.body.textContent.includes('Review'), 'Review tile is present');
      assert(document.body.textContent.includes('Saved'), 'Saved tile is present');

      results.push({ test: 'home-page-hierarchy-and-card', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 2: Verify Level Selection Page ('/learn')
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/learn'], hsk1Items }));
      await waitFor(() => document.querySelectorAll('.level-picker__grid .surface-card').length >= 6, 4000, 'step2-level-picker-cards');

      const levelTiles = document.querySelectorAll('.level-picker__grid .surface-card');
      assert(levelTiles.length === 9, `Expected 9 HSK level tiles, found ${levelTiles.length}`);

      // Check 2-column responsive grid
      const grid = document.querySelector('.level-picker__grid');
      assert(grid !== null, 'Level picker grid is present');

      // First tile is HSK 1: active, 0% completed
      const hsk1Tile = levelTiles[0];
      assert(hsk1Tile.textContent.includes('HSK 1'), 'First tile is HSK 1');
      assert(hsk1Tile.textContent.includes('0% completed'), 'HSK 1 shows 0% completed');

      // Second tile is HSK 2: 0% completed
      const hsk2Tile = levelTiles[1];
      assert(hsk2Tile.textContent.includes('HSK 2'), 'Second tile is HSK 2');
      assert(hsk2Tile.textContent.includes('0% completed'), 'HSK 2 shows 0% completed');

      results.push({ test: 'level-selection-3x3-and-availability', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 3: Verify Course Overview Page ('/learn/level/HSK1')
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/learn/level/HSK1'], hsk1Items }));
      await waitFor(() => document.querySelector('.lesson-word-list') !== null, 4000, 'step3-lesson-word-list');

      // Hero Card Identity
      const heroCard = document.querySelector('.lesson-hero-card');
      assert(heroCard !== null, 'Lesson hero card is present');
      assert(heroCard.textContent.includes('NOW LEARNING'), 'Hero shows NOW LEARNING');
      assert(heroCard.textContent.includes('HSK 1'), 'Hero shows HSK 1');
      assert(heroCard.textContent.includes('0 / 300 completed'), 'Hero shows 0 / 300 completed');

      // Primary CTA on Course Overview
      const heroStudyBtn = heroCard.querySelector('.lesson-hero-card__study-btn');
      assert(heroStudyBtn !== null, 'Hero has primary study CTA');
      assert(heroStudyBtn.textContent.includes('Start learning'), 'CTA text is Start learning');
      assert(heroStudyBtn.getAttribute('href').includes('/learn/session'), 'CTA links to /learn/session');

      // Quick Practice tiles
      assert(document.body.textContent.includes('Flashcard practice'), 'Contains Flashcard practice');
      assert(document.body.textContent.includes('Review'), 'Contains Review link');
      assert(document.body.textContent.includes('Saved Words'), 'Contains Saved link');

      // Word list & 300 words
      const wordList = document.querySelector('.lesson-word-list');
      const words = wordList.querySelectorAll('.lesson-word');
      assert(words.length === 300, `All 300 words present, found ${words.length}`);

      // First word details (Chinese, pinyin, English, audio)
      const firstWord = words[0];
      assert(firstWord.textContent.includes('爱'), `First word character is 爱.`);
      assert(firstWord.textContent.includes('ài'), 'First word pinyin is ài');
      assert(firstWord.textContent.includes('to love'), 'First word English is to love');
      const audioBtn = firstWord.querySelector('button[aria-label*="audio"]') || firstWord.querySelector('button');
      assert(audioBtn !== null, 'Audio button is mounted');

      // Search interaction
      const searchInput = document.querySelector('input[placeholder="Search..."]');
      assert(searchInput !== null, 'Search input is present');
      setReactInputValue(searchInput, '爱');
      await waitFor(() => document.querySelectorAll('.lesson-word').length === 1, 4000, 'step3-search-ai');
      assert(document.querySelectorAll('.lesson-word').length === 1, 'Search filters to exactly 1 word for 爱');

      // Clear search
      setReactInputValue(searchInput, '');
      await waitFor(() => document.querySelectorAll('.lesson-word').length === 300, 4000, 'step3-search-clear');
      assert(document.querySelectorAll('.lesson-word').length === 300, 'Search cleared restores 300 words');

      results.push({ test: 'course-overview-client-card-and-300-words', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 4: Verify Learning Session Navigation ('/learn/session?level=HSK1')
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/learn/session?level=HSK1'], hsk1Items }));
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 'step4-swipe-card-active');

      const activeCard = document.querySelector('.swipe-card--active');
      assert(activeCard !== null, 'Active flashcard is mounted in SwipeSession');
      assert(activeCard.textContent.includes('爱'), 'Active card presents first unstudied word 爱');
      assert(activeCard.querySelector('.swipe-bookmark') !== null, 'Bookmark button is present on flashcard');
      assert(activeCard.querySelector('.swipe-audio') !== null, 'Audio button is present on flashcard');

      results.push({ test: 'learning-session-navigation-and-mount', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 5: Verify Auth (/login) Standalone Mounting & Reachability
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/login'], hsk1Items }));
      await waitFor(() => document.querySelector('.auth-card') !== null, 4000, 'step5-login-mounted');

      // Verify no Layout elements (no app-navigation, no app-sidebar)
      assert(document.querySelector('.app-navigation') === null, 'Auth screen does not mount app-navigation');
      assert(document.querySelector('.app-sidebar') === null, 'Auth screen does not mount app-sidebar');

      // Verify Google auth button with icon & >=44px height if enabled
      const googleBtn = document.querySelector('.auth-provider-btn');
      if (googleBtn) {
        assert(googleBtn.querySelector('svg') !== null, 'Google icon SVG is present inside button');
        const googleRect = googleBtn.getBoundingClientRect();
        assert(googleRect.height >= 44, 'Google sign-in button meets >=44px touch target');
      }

      // Verify Guest action button & >=44px height
      const guestBtn = document.querySelector('.auth-guest') || document.querySelector('.btn-secondary');
      assert(guestBtn !== null, 'Guest action button is present');
      const guestRect = guestBtn.getBoundingClientRect();
      assert(guestRect.height >= 44, 'Guest action button meets >=44px touch target');

      results.push({ test: 'auth-standalone-and-reachability', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 6: Verify Library Search and View Controls
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/library'], hsk1Items }));
      await waitFor(() => document.querySelectorAll('.surface-card').length >= 4, 4000, 'step6-library-mounted');

      // View toggle: grid <-> list
      const viewToggle = document.querySelector('button[aria-label*="view"]');
      assert(viewToggle !== null, 'View toggle button exists');
      const initialLabel = viewToggle.getAttribute('aria-label');
      viewToggle.click();
      await sleep(50);
      assert(viewToggle.getAttribute('aria-label') !== initialLabel, 'View toggle toggles mode');
      viewToggle.click();
      await sleep(50);

      // Search input interaction
      const libSearchInput = document.querySelector('input[placeholder*="Search"]');
      assert(libSearchInput !== null, 'Library search input is present');
      const totalToolsBefore = document.querySelectorAll('.surface-card').length;
      setReactInputValue(libSearchInput, 'Writing');
      await sleep(50);
      const totalToolsFiltered = document.querySelectorAll('.surface-card').length;
      assert(totalToolsFiltered < totalToolsBefore, 'Search filters tools');

      // Clear search
      setReactInputValue(libSearchInput, '');
      await sleep(50);
      assert(document.querySelectorAll('.surface-card').length === totalToolsBefore, 'Clearing search restores tools');

      results.push({ test: 'library-search-and-view-controls', passed: true });
      unmountTree();

      // -----------------------------------------------------------------------
      // Step 7: Verify Settings Preferences Mounting
      // -----------------------------------------------------------------------
      renderTree(createElement(AppTestWrapper, { initialEntries: ['/settings'], hsk1Items }));
      await waitFor(() => document.querySelectorAll('.surface-card').length >= 3, 4000, 'step7-settings-mounted');
      assert(document.body.textContent.includes('Audio'), 'Settings contains Audio group');
      results.push({ test: 'settings-preferences-mounted', passed: true });

      // Send success report
      await fetch('/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ success: true, results }),
      });
    }

    // -------------------------------------------------------------------------
    // Execution Mode Switcher:
    // ?mode=capture => Deterministic single-route mount & pre-capture measurement
    // ?mode=test (default) => Full 4-stage interaction verification sequence
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const executionMode = urlParams.get('mode') || 'test';

    async function runCaptureMode() {
      const targetRoute = urlParams.get('route') || '/';
      const pageName = urlParams.get('page') || 'home';
      const expectedWidth = Number(urlParams.get('width')) || window.innerWidth;
      const hsk1Items = await loadHsk1Items();
      const n5Items = await loadN5Items();
      const langParam = urlParams.get('lang') || (targetRoute.includes('level/N5') || targetRoute.includes('level=N5') ? 'ja' : 'zh');
      setActiveLanguageId(langParam);
      const activeItems = langParam === 'ja' ? n5Items : hsk1Items;
      const activeLevelId = langParam === 'ja' ? 'N5' : 'HSK1';

      // Reset storage for clean deterministic capture view
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      if (pageName === 'review-collection' || targetRoute === '/learn/review') {
        const sampleWords = activeItems.slice(0, 6).map((item, i) => ({
          id: `rev-${i + 1}`,
          word: item.character,
          phrase: item.character,
          reading: item.reading,
          english: item.definition,
          burmese: item.burmese_definition,
          level_id: activeLevelId,
          created_at: new Date().toISOString(),
        }));
        db.set('review_cards', sampleWords);
      } else if (pageName === 'saved-collection' || targetRoute === '/saved') {
        const sampleWords = activeItems.slice(0, 6).map((item, i) => ({
          id: `save-${i + 1}`,
          card_id: item.card_id,
          word: item.character,
          phrase: item.character,
          reading: item.reading,
          english: item.definition,
          burmese: item.burmese_definition,
          level_id: activeLevelId,
          created_at: new Date().toISOString(),
        }));
        db.set('saved_words', sampleWords);
      }

      const isCatalogDisabled = urlParams.get('catalogDisabled') === '1' || pageName === 'library-catalog-disabled';
      const isStorageError = urlParams.get('storageError') === '1' || pageName === 'library-storage-error';
      const isSignedIn = urlParams.get('auth') === 'user' || pageName.includes('signed-in') || pageName.includes('mobile-actions-scrolled');

      let authValue = null;
      if (isSignedIn) {
        const mockUser = {
          id: 'd3b07384-d113-4632-b7b8-89c0b1e42777',
          email: 'learner@example.com',
          user_metadata: { full_name: 'Alex Rivera' },
          app_metadata: { providers: ['email'] },
          identities: [{ provider: 'email' }],
        };
        storageOwner.setOwner(mockUser.id);
        try {
          const streakData = {
            currentStreak: 7,
            streakDays: 7,
            longestStreak: 7,
            updatedAt: new Date().toISOString(),
          };
          localStorage.setItem(`s2s_user_${mockUser.id.toLowerCase()}_study_streak_v1`, JSON.stringify(streakData));
          db.set('learned_words', [
            { word: '爱', character: '爱', reading: 'ài', seen: 1, status: 'known', level: 'HSK1', timestamp: Date.now() },
            { word: '八', character: '八', reading: 'bā', seen: 1, status: 'known', level: 'HSK1', timestamp: Date.now() }
          ]);
        } catch {}
        authValue = {
          user: mockUser,
          loading: false,
          isTransitioning: false,
          error: null,
          clearError: () => {},
          retryVerification: () => {},
          signOut: async () => ({}),
          signOutGlobal: async () => ({}),
          canResetPassword: () => false,
          completePasswordRecovery: () => {},
          passwordRecoveryUserId: null,
          captureGeneration: () => 1,
          isCurrent: () => true,
          isGuest: false,
          isConfigured: true,
          generation: 1,
        };

        const mockClient = {
          auth: {
            getUser: async () => ({ data: { user: mockUser }, error: null }),
            getSession: async () => ({ data: { session: { user: mockUser } }, error: null }),
          },
          from: (table) => {
            if (table === 'profiles') {
              return {
                select: () => ({
                  eq: () => ({
                    maybeSingle: async () => ({
                      data: {
                        id: mockUser.id,
                        display_name: 'Alex Rivera',
                        avatar_path: null,
                        created_at: '2026-01-01T00:00:00Z',
                        updated_at: '2026-01-01T00:00:00Z',
                      },
                      error: null,
                    }),
                  }),
                }),
              };
            }
            return {
              select: () => ({ eq: () => ({ maybeSingle: async () => ({ data: null, error: null }) }) }),
            };
          },
        };
        setSupabaseClient(mockClient);
      } else {
        storageOwner.setOwner(null);
      }

      if (isStorageError) {
        try {
          localStorage.setItem('s2s_zh_saved_words', 'invalid JSON {{{');
        } catch {}
      }

      renderTree(createElement(AppTestWrapper, {
        initialEntries: [targetRoute],
        hsk1Items,
        n5Items,
        publishedEnabled: !isCatalogDisabled,
        authValue,
      }));

      // Wait for the specific page element to mount
      if (pageName === 'home' || targetRoute === '/') {
        await waitFor(() => document.querySelector('.home-page') !== null && document.querySelector('.course-badge') !== null, 4000, 'capture-home-mounted');
      } else if (pageName === 'levels' || targetRoute === '/learn' || pageName === 'levels-scrolled-hsk4') {
        await waitFor(() => document.querySelector('.level-picker__grid') !== null && document.querySelectorAll('.surface-card').length >= (langParam === 'ja' ? 5 : 6), 4000, 'capture-levels-mounted');
        if (pageName === 'levels-scrolled-hsk4') {
          const hsk4 = Array.from(document.querySelectorAll('.surface-card')).find(c => c.textContent.includes('HSK 4'));
          if (hsk4) {
            hsk4.scrollIntoView({ block: 'center' });
            await sleep(150);
          }
        } else {
          window.scrollTo(0, 0);
          const appMain = document.querySelector('.app-main') || document.documentElement;
          if (appMain) appMain.scrollTop = 0;
        }
      } else if (pageName === 'course-overview' || targetRoute.startsWith('/learn/level/')) {
        await waitFor(() => document.querySelector('.lesson-hero-card') !== null && document.querySelector('.lesson-word-list') !== null, 4000, 'capture-course-overview-mounted');
      } else if (pageName === 'session-results') {
        // Complete the session through real production swipe/button actions
        await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 'capture-session-first-card');
        while (!document.querySelector('.session-results-card')) {
          const learnedBtn = document.querySelector('.swipe-action--learned');
          const reviewBtn = document.querySelector('.swipe-action--review');
          if (!learnedBtn && !reviewBtn) break;
          const currentProgress = document.querySelector('.swipe-session__progress progress') || document.querySelector('progress');
          const currentVal = Number(currentProgress?.getAttribute('value') || 0);
          const targetVal = currentVal + 1;

          if (currentVal % 3 === 2) {
            reviewBtn.click();
          } else {
            learnedBtn.click();
          }

          // Wait for progress value to advance or results card to appear
          await waitFor(() => {
            if (document.querySelector('.session-results-card')) return true;
            const p = document.querySelector('.swipe-session__progress progress') || document.querySelector('progress');
            return p && Number(p.getAttribute('value')) >= targetVal;
          }, 5000, `advance-to-progress-${targetVal}`);

          // Wait for locked state to unlock before clicking next action
          await waitFor(() => {
            if (document.querySelector('.session-results-card')) return true;
            const lb = document.querySelector('.swipe-action--learned');
            return lb && !lb.disabled;
          }, 3000, `unlock-action-for-progress-${targetVal}`);
        }
        await waitFor(() => document.querySelector('.session-results-card') !== null, 4000, 'capture-session-results-mounted');
      } else if (pageName === 'flashcard-front') {
        await waitFor(() => document.querySelector('.swipe-card--active') !== null && document.querySelector('.swipe-card__front') !== null, 4000, 'capture-flashcard-front-mounted');
      } else if (pageName === 'flashcard-back') {
        // Reveal back face via real production Reveal action
        await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 'capture-flashcard-active');
        const flipBtn = document.querySelector('.swipe-action--flip');
        assert(flipBtn !== null, 'Flip/Reveal button must be present');
        flipBtn.click();
        await waitFor(() => {
          const back = document.querySelector('.swipe-card__back');
          return back && !back.hasAttribute('inert') && document.querySelector('.swipe-card__examples') !== null;
        }, 4000, 'capture-flashcard-back-mounted');
      } else if (pageName === 'review-collection' || targetRoute === '/learn/review') {
        await waitFor(() => document.querySelector('.collection-hero') !== null, 4000, 'capture-review-collection-mounted');
      } else if (pageName === 'saved-collection' || targetRoute === '/saved') {
        await waitFor(() => document.querySelector('.collection-hero') !== null, 4000, 'capture-saved-collection-mounted');
      } else if (pageName === 'library' || pageName === 'library-catalog-disabled' || pageName === 'library-storage-error' || targetRoute === '/library') {
        await waitFor(() => document.querySelectorAll('.surface-card').length >= 4, 4000, 'capture-library-mounted');
      } else if ((pageName.startsWith('profile') && !pageName.includes('edit')) || targetRoute === '/profile') {
        await waitFor(() => document.body.textContent.includes('Streak') && document.body.textContent.includes('Swiped'), 4000, 'capture-profile-mounted');
        if (pageName === 'profile-mobile-actions-scrolled') {
          const appMain = document.querySelector('.app-main');
          if (appMain) {
            appMain.scrollTop = appMain.scrollHeight;
          }
          await sleep(200);
        }
      } else if (pageName === 'settings' || targetRoute === '/settings') {
        await waitFor(() => document.body.textContent.includes('Settings'), 4000, 'capture-settings-mounted');
      } else if (pageName === 'login' || pageName === 'login-toggle-focus' || targetRoute === '/login') {
        await waitFor(() => document.querySelector('.auth-card') !== null && document.querySelector('.auth-submit') !== null, 4000, 'capture-login-mounted');
        assert(document.querySelector('.app-navigation') === null, 'Login must not contain bottom navigation');
        assert(document.querySelector('.app-sidebar') === null, 'Login must not contain app sidebar');
        const googleBtn = document.querySelector('.auth-provider-btn');
        assert(googleBtn !== null, 'Google sign-in button must be present on Login');
        assert(googleBtn.querySelector('svg') !== null, 'Google icon SVG must be present inside Google button');
        const guestBtn = document.querySelector('.auth-guest');
        assert(guestBtn !== null, 'Guest action button must be present on Login');
        if (pageName === 'login-toggle-focus' || urlParams.get('focus') === 'toggle') {
          const toggle = document.querySelector('.auth-input-toggle');
          if (toggle) {
            toggle.focus();
            await sleep(100);
          }
        }
      } else if (pageName === 'library-scrolled-writing') {
        await waitFor(() => document.querySelector('.library-page') !== null, 4000, 'capture-library-scrolled-writing-mounted');
        const writingLink = document.querySelector('a[href="/writing"]') || Array.from(document.querySelectorAll('.library-tool')).find(t => t.textContent.includes('Writing'));
        if (writingLink) {
          writingLink.scrollIntoView({ block: 'center' });
        }
        await sleep(150);
      } else if (pageName === 'bottom-clearance') {
        await waitFor(() => document.querySelector('.library-page') !== null, 4000, 'capture-bottom-clearance-mounted');
        const appMain = document.querySelector('.app-main');
        if (appMain) {
          appMain.scrollTop = appMain.scrollHeight;
        }
        await sleep(150);
      } else if (pageName === 'dictionary' || targetRoute === '/dictionary') {
        await waitFor(() => document.querySelector('.dictionary-page') !== null || document.body.textContent.includes('Dictionary') || document.body.textContent.includes('Search'), 4000, 'capture-dictionary-mounted');
      } else if (pageName === 'interest' || targetRoute === '/interest') {
        await waitFor(() => document.body.textContent.includes('Study by Interest'), 4000, 'capture-interest-mounted');
      } else if (pageName === 'phrases-level' || targetRoute.startsWith('/flashcards/level/')) {
        await waitFor(() => document.body.textContent.includes('phrases mastered') || document.body.textContent.includes('course modules'), 4000, 'capture-phrases-level-mounted');
      } else if (pageName === 'premium' || targetRoute === '/premium') {
        await waitFor(() => document.body.textContent.includes('Premium'), 4000, 'capture-premium-mounted');
      } else if (pageName === 'notifications' || targetRoute === '/notifications') {
        await waitFor(() => document.body.textContent.includes('Notifications') || document.body.textContent.includes('No notifications') || document.body.textContent.includes('Notification'), 4000, 'capture-notifications-mounted');
      } else if (pageName === 'profile-edit' || targetRoute === '/profile/edit') {
        await waitFor(() => document.body.textContent.includes('Edit profile') || document.body.textContent.includes('Display name') || document.body.textContent.includes('Save changes'), 4000, 'capture-profile-edit-mounted');
      } else {
        await waitFor(() => document.querySelector('#main-content') !== null, 4000, 'capture-generic-mounted');
      }

      // Explicitly load representative English, Chinese, Burmese, and pinyin font samples
      if (document.fonts && document.fonts.load) {
        try {
          await Promise.all([
            document.fonts.load('400 16px "Inter"', 'Swipe to Study English AaBbCc 123'),
            document.fonts.load('600 16px "Inter"', 'Buttons & Labels 456'),
            document.fonts.load('700 16px "Inter"', 'Headings 700'),
            document.fonts.load('800 16px "Inter"', 'Auth Title 800'),
            document.fonts.load('400 16px "Noto Sans SC"', '学习汉语爱 123'),
            document.fonts.load('400 16px "Noto Sans Myanmar"', 'ကျွန်တော် ချစ်သည်'),
            document.fonts.load('400 16px "JetBrains Mono"', 'xuéxí ài 123'),
          ]);
        } catch (fontErr) {
          console.warn('[FONT_LOAD_WARN]', fontErr);
        }
      }
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      await sleep(100);

      const fontStatus = {
        inter: document.fonts.check('16px "Inter"', 'Swipe to Study English AaBbCc 123'),
        interPinyin: document.fonts.check('16px "Inter"', 'nǐ hǎo ā á ǎ à ē é ě è ī í ǐ ì ō ó ǒ ò ū ú ǔ ù ǖ ǘ ǚ ǜ'),
        notoSc: document.fonts.check('16px "Noto Sans SC"', '汉语水平考试 学习词汇'),
        notoMyanmar: document.fonts.check('16px "Noto Sans Myanmar"', 'မြန်မာဘာသာ'),
        jetbrainsMono: document.fonts.check('16px "JetBrains Mono"', 'pīnyīn 123'),
      };

      // Verify the font actually rendered for the selected platform
      const isApple = /Macintosh|Mac OS X|iPhone|iPad|iPod/.test(navigator.userAgent) ||
        /Mac|iPhone|iPad|iPod/.test(navigator.platform || '');
      const isWindowsHost = navigator.platform.includes('Win') || /Windows/.test(navigator.userAgent);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const sampleText = 'Swipe to Study English AaBbCc 123';
      ctx.font = '16px "Inter", sans-serif';
      const interW = ctx.measureText(sampleText).width;

      // Resolve actual CSS variable or read resolved DOM properties
      const bodyComputedFont = window.getComputedStyle(document.body).fontFamily;
      ctx.font = `16px ${bodyComputedFont}`;
      const stackW = ctx.measureText(sampleText).width;

      // Check whether Apple system font is actually rendered or if running on non-Apple/Windows host
      let actualRendered = 'fallback-sans';
      if (Math.abs(stackW - interW) < 0.5) {
        actualRendered = 'Inter';
      } else if (isApple && !isWindowsHost) {
        actualRendered = 'system-apple';
      }

      // Do not automatically pass Apple platforms on Windows emulation:
      // On Windows host emulation, Inter is the authentic rendered font from our stack.
      const matchesPlatform = (actualRendered === 'Inter' || (!isWindowsHost && isApple && actualRendered === 'system-apple'));

      const renderedFontInfo = {
        platform: navigator.platform,
        isApple,
        isWindowsHost,
        expectedFont: (!isWindowsHost && isApple) ? 'system-apple' : 'Inter',
        actualRendered,
        resolvedFontFamily: bodyComputedFont,
        matchesPlatform,
        interChecked: fontStatus.inter,
        interPinyinChecked: fontStatus.interPinyin,
        notoScChecked: fontStatus.notoSc,
        notoMyanmarChecked: fontStatus.notoMyanmar,
        jetbrainsMonoChecked: fontStatus.jetbrainsMono,
      };

      const measuredWidth = window.innerWidth;
      const outerWidth = window.outerWidth;
      const docScrollWidth = document.documentElement.scrollWidth;
      const bodyScrollWidth = document.body.scrollWidth;
      const scrollWidth = Math.max(docScrollWidth, bodyScrollWidth);
      // Horizontal overflow check: scrollWidth must not exceed innerWidth by more than 2px (subpixel/scrollbar tolerance)
      const hasHorizontalOverflow = scrollWidth > (measuredWidth + 2);
      const overflowElements = [];
      if (hasHorizontalOverflow) {
        document.querySelectorAll('*').forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.right > measuredWidth + 2) {
            overflowElements.push({ tag: el.tagName, className: el.className, id: el.id, right: rect.right, width: rect.width });
          }
        });
      }

      let computedColumns = null;
      const grid = document.querySelector('.level-picker__grid') || document.querySelector('.level-overview__grid') || document.querySelector('.collection-list');
      if (grid) {
        const style = window.getComputedStyle(grid);
        computedColumns = style.gridTemplateColumns.split(' ').filter(Boolean).length;
      }

      let heroStyles = null;
      const hero = document.querySelector('.collection-hero');
      if (hero) {
        const eyebrow = hero.querySelector('.study-eyebrow');
        const action = hero.querySelector('.collection-hero__action');
        const heading = hero.querySelector('.collection-hero__copy h2');
        const subtitle = hero.querySelector('.collection-hero__copy > p:last-child');

        const getEffectiveOpacity = (el) => {
          let op = 1;
          let curr = el;
          while (curr && curr !== document) {
            const s = window.getComputedStyle(curr);
            const val = parseFloat(s.opacity);
            if (!isNaN(val)) op *= val;
            curr = curr.parentElement;
          }
          return op;
        };

        let hoverBackground = null;
        let hoverColor = null;
        for (const sheet of document.styleSheets) {
          try {
            for (const rule of sheet.cssRules || []) {
              if (rule.selectorText && (
                rule.selectorText.includes('.collection-hero--saved .collection-hero__action:hover') ||
                rule.selectorText.includes('.collection-hero--review .collection-hero__action:hover')
              )) {
                if (hero.classList.contains('collection-hero--saved') && rule.selectorText.includes('--saved')) {
                  hoverBackground = rule.style.background || rule.style.backgroundColor;
                  hoverColor = rule.style.color;
                }
                if (hero.classList.contains('collection-hero--review') && rule.selectorText.includes('--review')) {
                  hoverBackground = rule.style.background || rule.style.backgroundColor;
                  hoverColor = rule.style.color;
                }
              }
            }
          } catch (e) {}
        }

        heroStyles = {
          heroBackground: window.getComputedStyle(hero).backgroundImage || window.getComputedStyle(hero).backgroundColor,
          eyebrowColor: eyebrow ? window.getComputedStyle(eyebrow).color : null,
          eyebrowOpacity: eyebrow ? getEffectiveOpacity(eyebrow) : null,
          headingColor: heading ? window.getComputedStyle(heading).color : null,
          subtitleColor: subtitle ? window.getComputedStyle(subtitle).color : null,
          actionColor: action ? window.getComputedStyle(action).color : null,
          actionBackground: action ? window.getComputedStyle(action).backgroundColor : null,
          actionOpacity: action ? getEffectiveOpacity(action) : null,
          hoverBackground,
          hoverColor,
        };
      }

      // Check mobile fixed navigation clearance
      let navClearance = null;
      const fixedNav = document.querySelector('.app-navigation');
      const appMain = document.querySelector('.app-main');
      if (fixedNav && appMain) {
        const navRect = fixedNav.getBoundingClientRect();
        const mainStyle = window.getComputedStyle(appMain);
        const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
        const navStyle = window.getComputedStyle(fixedNav);
        const isFixed = navStyle.position === 'fixed' && navStyle.display !== 'none';
        const isBottomNav = isFixed && window.innerWidth < 768 && navRect.top > (window.innerHeight / 2);

        if (isBottomNav) {
          const originalScrollTop = appMain.scrollTop;
          // Scroll actual appMain container to end
          appMain.scrollTop = appMain.scrollHeight;
          await sleep(50);

          const controls = Array.from(appMain.querySelectorAll('button:not([disabled]), a[href], input, select, textarea, [tabindex="0"]'))
            .filter(el => {
              const rect = el.getBoundingClientRect();
              return rect.width > 0 && rect.height > 0;
            });
          const lastControl = controls[controls.length - 1];
          const lastRect = lastControl ? lastControl.getBoundingClientRect() : null;
          const clearsNav = lastRect ? (lastRect.bottom <= navRect.top + 1) : true;
          if (!clearsNav) {
            throw new Error(`Navigation clearance check failed: final control (${lastControl?.tagName}.${lastControl?.className}) at bottom y=${lastRect?.bottom}px is obscured behind fixed navigation at top y=${navRect.top}px`);
          }
          navClearance = {
            hasFixedNav: true,
            navHeight: navRect.height,
            navTop: navRect.top,
            lastControlBottom: lastRect ? lastRect.bottom : null,
            paddingBottom,
            clearsNav: true,
          };

          // Restore scroll position so non-scrolled mobile captures match intended viewports
          if (!pageName.includes('scrolled') && !pageName.includes('bottom')) {
            appMain.scrollTop = originalScrollTop;
            await sleep(50);
          }

          if (pageName === 'levels-scrolled-hsk4') {
            const hsk4 = document.querySelector('a[href*="HSK4"]');
            if (hsk4) {
              hsk4.scrollIntoView({ block: 'center' });
              await sleep(100);
            }
          } else if (pageName === 'levels') {
            appMain.scrollTop = 0;
            await sleep(50);
          }
        } else {
          navClearance = {
            hasFixedNav: isFixed,
            navHeight: navRect.height,
            paddingBottom,
            clearsNav: true,
          };
        }
      }

      // Real interactive hover measurement
      let interactiveHover = null;
      const hoverTarget = document.querySelector('.collection-hero__action') || document.querySelector('.btn-primary') || document.querySelector('.auth-submit');
      if (hoverTarget) {
        const normalColor = window.getComputedStyle(hoverTarget).color;
        const normalBg = window.getComputedStyle(hoverTarget).backgroundColor;
        hoverTarget.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
        hoverTarget.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        interactiveHover = {
          normalColor,
          normalBg,
          hoverColor: window.getComputedStyle(hoverTarget).color,
          hoverBg: window.getComputedStyle(hoverTarget).backgroundColor,
        };
      }

      const metrics = {
        success: true,
        page: pageName,
        route: targetRoute,
        expectedWidth,
        measuredWidth,
        outerWidth,
        hasHorizontalOverflow,
        scrollWidth,
        computedColumns,
        overflowElements: overflowElements.slice(0, 5),
        heroStyles,
        navClearance,
        interactiveHover,
        fontStatus,
        renderedFontInfo,
        pageMounted: true,
      };

      document.body.setAttribute('data-capture-ready', 'true');

      await fetch('/capture-metrics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(metrics),
      });
    }

    if (executionMode === 'capture') {
      runCaptureMode().catch(async (err) => {
        await fetch('/capture-metrics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ success: false, error: err.stack || err.message }),
        });
      });
    } else {
      runVerification().catch(async (err) => {
        await fetch('/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ success: false, error: err.stack || err.message }),
        });
      });
    }
  </script>
</body>
</html>
