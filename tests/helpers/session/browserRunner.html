<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SwipeSession, ReviewWords, and SavedWords Interactive Verification</title>
  <style>
    :root {
      --color-ghost-blue: #EFF6FF;
      --color-primary-blue: #0369A1;
      --color-border: #BAE6FD;
      --color-text-navy: #0C4A6E;
      --color-page-bg: #F0F9FF;
      --shadow-soft: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-raised: 0 8px 24px rgba(0,0,0,0.1);
      --font-reading: system-ui, -apple-system, sans-serif;
      --font-mono: monospace;
    }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    #root { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { createElement } from 'react';
    import { createRoot } from 'react-dom/client';
    import { MemoryRouter } from 'react-router-dom';
    import { LanguageProvider } from '/src/lib/language.jsx';
    import { PreferencesProvider } from '/src/lib/preferences.jsx';
    import { PublishedContentProvider } from '/src/lib/publishedContentContext.jsx';
    import { AuthContext } from '/src/lib/authContext.js';
    import SwipeSession from '/src/pages/Learn/SwipeSession.jsx';
    import ReviewWords from '/src/pages/Learn/ReviewWords.jsx';
    import SavedWords from '/src/pages/SavedWords.jsx';
    import { db } from '/src/lib/db.js';

    const rootElement = document.getElementById('root');
    let reactRoot = null;
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function waitFor(condition, timeoutMs = 4000, label = 'unnamed', intervalMs = 25) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        try {
          if (condition()) return;
        } catch {}
        await sleep(intervalMs);
      }
      throw new Error(`waitFor[${label}] timed out after ${timeoutMs}ms. Root: ` + rootElement.innerHTML.slice(0, 500));
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }

    const testCards = [
      {
        id: 'card-1',
        card_id: 'zh-hsk1-001',
        course_id: 'zh-hsk1',
        written_form: '爱',
        character: '爱',
        reading: 'ài',
        pronunciation: 'ài',
        meaning_english: 'to love',
        definition: 'to love',
        meaning_burmese: 'ချစ်သည်',
        burmese_definition: 'ချစ်သည်',
        level: 'HSK1',
        sort_order: 1,
        is_active: true,
        examples: [{ text: '我爱你。', reading: 'Wǒ ài nǐ.', english: 'I love you.', burmese: 'ကျွန်တော် မင်းကို ချစ်တယ်။' }],
        audio_path: 'audio/zh/hsk1/ai.mp3',
      },
      {
        id: 'card-2',
        card_id: 'zh-hsk1-002',
        course_id: 'zh-hsk1',
        written_form: '八',
        character: '八',
        reading: 'bā',
        pronunciation: 'bā',
        meaning_english: 'eight',
        definition: 'eight',
        meaning_burmese: 'ရှစ်',
        burmese_definition: 'ရှစ်',
        level: 'HSK1',
        sort_order: 2,
        is_active: true,
        examples: [{ text: '八个人。', reading: 'Bā gè rén.', english: 'Eight people.', burmese: 'ရှစ်ယောက်။' }],
        audio_path: 'audio/zh/hsk1/ba.mp3',
      },
      {
        id: 'card-3',
        card_id: 'zh-hsk1-003',
        course_id: 'zh-hsk1',
        written_form: '爸爸',
        character: '爸爸',
        reading: 'bàba',
        pronunciation: 'bàba',
        meaning_english: 'dad',
        definition: 'dad',
        meaning_burmese: 'အဖေ',
        burmese_definition: 'အဖေ',
        level: 'HSK1',
        sort_order: 3,
        is_active: true,
        examples: [{ text: '我爸爸很好。', reading: 'Wǒ bàba hěn hǎo.', english: 'My dad is great.', burmese: 'ကျွန်တော့်အဖေ အရမ်းကောင်းတယ်။' }],
        audio_path: 'audio/zh/hsk1/baba.mp3',
      },
    ];

    function renderTree(element) {
      if (!reactRoot) reactRoot = createRoot(rootElement);
      reactRoot.render(element);
    }

    function unmountTree() {
      if (reactRoot) {
        reactRoot.unmount();
        reactRoot = null;
        rootElement.innerHTML = '';
      }
    }

    function mountSwipeSession(initialEntry = '/learn/level/HSK1', items = testCards) {
      const initialCache = {
        'zh-hsk1': {
          status: 'loaded',
          items,
          version: 1,
          error: null,
          isPublished: true,
        },
      };

      renderTree(
        createElement(
          AuthContext.Provider,
          { value: { user: null, isGuest: true, loading: false, isTransitioning: false } },
          createElement(
            PreferencesProvider,
            null,
            createElement(
              LanguageProvider,
              null,
              createElement(
                PublishedContentProvider,
                { enabledOverride: true, initialCache },
                createElement(
                  MemoryRouter,
                  { initialEntries: [initialEntry] },
                  createElement(SwipeSession, null)
                )
              )
            )
          )
        )
      );
    }

    function mountReviewWords() {
      renderTree(
        createElement(
          AuthContext.Provider,
          { value: { user: null, isGuest: true, loading: false, isTransitioning: false } },
          createElement(
            PreferencesProvider,
            null,
            createElement(
              LanguageProvider,
              null,
              createElement(
                MemoryRouter,
                { initialEntries: ['/learn/review'] },
                createElement(ReviewWords, null)
              )
            )
          )
        )
      );
    }

    function mountSavedWords() {
      renderTree(
        createElement(
          AuthContext.Provider,
          { value: { user: null, isGuest: true, loading: false, isTransitioning: false } },
          createElement(
            PreferencesProvider,
            null,
            createElement(
              LanguageProvider,
              null,
              createElement(
                MemoryRouter,
                { initialEntries: ['/saved'] },
                createElement(SavedWords, null)
              )
            )
          )
        )
      );
    }

    async function runTests() {
      const results = [];

      // =======================================================================
      // Test 1: Mixed session exact action counts & completion on final action
      // =======================================================================
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      mountSwipeSession('/learn/level/HSK1', testCards);
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 't1-first-card');

      // Card 1: Review action (swipe left)
      assert(document.querySelector('.session-results-card') === null, 'Completion must not appear before final action');
      const revBtn1 = document.querySelector('.swipe-action--review');
      assert(revBtn1 !== null, 'Review button present');
      revBtn1.click();

      // Wait for progress value 1 and action unlocked
      await waitFor(() => {
        const p = document.querySelector('.swipe-session__progress progress');
        return p && Number(p.getAttribute('value')) >= 1;
      }, 4000, 't1-card1-advanced');
      await waitFor(() => {
        const b = document.querySelector('.swipe-action--learned');
        return b && !b.disabled;
      }, 4000, 't1-card2-unlocked');

      // Card 2: Still in session, completion not shown
      assert(document.querySelector('.session-results-card') === null, 'Completion must not appear on card 2 of 3');
      const learnBtn2 = document.querySelector('.swipe-action--learned');
      learnBtn2.click();

      // Wait for progress value 2 and action unlocked
      await waitFor(() => {
        const p = document.querySelector('.swipe-session__progress progress');
        return p && Number(p.getAttribute('value')) >= 2;
      }, 4000, 't1-card2-advanced');
      await waitFor(() => {
        const b = document.querySelector('.swipe-action--learned');
        return b && !b.disabled;
      }, 4000, 't1-card3-unlocked');

      // Card 3: Final card. Results card still absent before final action
      assert(document.querySelector('.session-results-card') === null, 'Completion must not appear before final card action');
      const learnBtn3 = document.querySelector('.swipe-action--learned');
      learnBtn3.click();

      // Final accepted action produces session completion summary
      await waitFor(() => document.querySelector('.session-results-card') !== null, 4000, 't1-results-card');

      const resultsCard = document.querySelector('.session-results-card');
      assert(resultsCard !== null, 'Results card is mounted');
      assert(resultsCard.textContent.includes('SESSION COMPLETE'), 'Shows SESSION COMPLETE');
      assert(resultsCard.textContent.includes('Great work!'), 'Shows Great work!');
      assert(resultsCard.textContent.includes('all 3 cards'), 'Mentions all 3 cards completed');

      // Exact stats: 3 studied, 2 learned, 1 review
      const statValues = Array.from(resultsCard.querySelectorAll('.session-stat-card__value')).map(el => el.textContent.trim());
      assert(statValues.includes('3'), 'Words studied count is 3');
      assert(statValues.includes('2'), 'Marked learned count is 2');
      assert(statValues.includes('1'), 'Sent to review count is 1');
      assert(resultsCard.textContent.includes('Words marked for review have been added to your Review queue.'), 'Review queue note shown');

      // Verify DB persistence of the exact actions
      const learnedDb = db.get('learned_words');
      const reviewDb = db.get('review_cards');
      assert(learnedDb.length === 3, 'All 3 cards recorded in learned_words');
      assert(reviewDb.length === 1, 'Card 1 recorded in review_cards');
      assert((reviewDb[0].phrase || reviewDb[0].character) === '爱', 'Review card phrase is 爱');

      results.push({ test: 'mixed-session-exact-action-counts-and-final-completion', passed: true });
      unmountTree();

      // =======================================================================
      // Test 2: Double-activation protection
      // =======================================================================
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      mountSwipeSession('/learn/level/HSK1', testCards);
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 't2-card-mounted');

      // Rapid successive clicks on Learned button
      const learnedBtn = document.querySelector('.swipe-action--learned');
      learnedBtn.click();
      learnedBtn.click();
      learnedBtn.click();

      // Wait for card 1 to advance
      await waitFor(() => {
        const p = document.querySelector('.swipe-session__progress progress');
        return p && Number(p.getAttribute('value')) >= 1;
      }, 4000, 't2-card-advanced');

      // Progress must be exactly 1, not 2 or 3
      const progressEl = document.querySelector('.swipe-session__progress progress');
      assert(Number(progressEl.getAttribute('value')) === 1, 'Progress advanced exactly once, double-activation guarded');

      results.push({ test: 'double-activation-protection', passed: true });
      unmountTree();

      // =======================================================================
      // Test 3: Early exit preserves unswiped card eligibility in next session
      // =======================================================================
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      mountSwipeSession('/learn/level/HSK1', testCards);
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 't3-session1-mounted');

      // Swipe only Card 1 (爱)
      document.querySelector('.swipe-action--learned').click();
      await waitFor(() => {
        const p = document.querySelector('.swipe-session__progress progress');
        return p && Number(p.getAttribute('value')) >= 1;
      }, 4000, 't3-card1-swiped');

      // Exit early by unmounting the session
      unmountTree();

      // Mount a new session with the same pool
      mountSwipeSession('/learn/level/HSK1', testCards);
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 't3-session2-mounted');

      // First card of new session must be Card 2 (八), because Card 1 (爱) is already studied
      const activeChar = document.querySelector('.swipe-card__front .swipe-card__character')?.textContent;
      assert(activeChar === '八', `Next session begins with unswiped card 八, received ${activeChar}`);

      results.push({ test: 'early-exit-preserves-unswiped-card-eligibility', passed: true });
      unmountTree();

      // =======================================================================
      // Test 4: Failed progress write does not inflate summary counts or advance
      // =======================================================================
      db.set('saved_words', []);
      db.set('learned_words', []);
      db.set('review_cards', []);

      mountSwipeSession('/learn/level/HSK1', testCards);
      await waitFor(() => document.querySelector('.swipe-card--active') !== null, 4000, 't4-mounted');

      // Intercept localStorage.setItem for learned_words writes
      const origSetItem = localStorage.setItem;
      localStorage.setItem = function(key, val) {
        if (key && key.includes('learned_words')) throw new Error('QuotaExceededStorageError');
        return origSetItem.apply(this, arguments);
      };

      try {
        const learnBtn = document.querySelector('.swipe-action--learned');
        learnBtn.click();

        // Accessible feedback appears
        await waitFor(() => document.querySelector('.swipe-session__notice') !== null, 4000, 't4-feedback-shown');
        const notice = document.querySelector('.swipe-session__notice');
        assert(notice.textContent.includes('Unable to save progress. Try again.'), 'Shows accessible failure notice');

        // Progress has NOT advanced
        const progress = document.querySelector('.swipe-session__progress progress');
        assert(Number(progress.getAttribute('value')) === 0, 'Progress must remain at 0 on failed write');

        // Card character remains Card 1 (爱)
        const char = document.querySelector('.swipe-card__front .swipe-card__character')?.textContent;
        assert(char === '爱', 'Deck remains on current card 爱');
      } finally {
        localStorage.setItem = origSetItem;
      }

      results.push({ test: 'failed-progress-write-does-not-advance-or-inflate-counts', passed: true });
      unmountTree();

      // =======================================================================
      // Test 5: ReviewWords unreadable collection honesty, retry, and recovery
      // =======================================================================
      db.set('review_cards', [{ id: 'rev-item-1', phrase: '爱', reading: 'ài', english: 'to love', burmese: 'ချစ်သည်' }]);

      const origGetItem = localStorage.getItem;
      // Sabotage review_cards read
      localStorage.getItem = function(key) {
        if (key && key.includes('review_cards')) throw new Error('UnreadableReviewDb');
        return origGetItem.apply(this, arguments);
      };

      mountReviewWords();
      await waitFor(() => document.querySelector('.study-error') !== null, 4000, 't5-review-error-mounted');

      // Verify honest unreadable presentation:
      const heroEl = document.querySelector('.collection-hero');
      assert(heroEl.classList.contains('collection-hero--unavailable'), 'Hero has collection-hero--unavailable class');
      assert(heroEl.textContent.includes('Collection unavailable'), 'Hero heading says Collection unavailable');
      assert(!heroEl.textContent.includes('0 words to review'), 'Hero does not report 0 words');
      assert(heroEl.querySelector('.collection-hero__action').textContent.includes('Retry'), 'Hero has Retry action');
      assert(!heroEl.textContent.includes('Start learning'), 'Hero has no Start learning CTA');

      // Word list status & error
      const statusText = document.querySelector('.study-section-heading [role="status"]').textContent;
      assert(statusText.includes('Status unavailable'), 'Status heading reports Status unavailable');
      assert(!statusText.includes('0 of 0 words'), 'Status heading does not report 0 of 0 words');

      const alertEl = document.querySelector('.study-error[role="alert"]');
      assert(alertEl !== null, 'Alert container is mounted');
      assert(alertEl.textContent.includes('Unable to load review words'), 'Alert mentions unable to load review words');
      assert(!document.body.textContent.includes('All caught up!'), 'Does not show empty-state copy');

      // Now recover DB and click retry
      localStorage.getItem = origGetItem;
      const retryBtn = alertEl.querySelector('button');
      assert(retryBtn !== null, 'Retry button present in error alert');
      retryBtn.click();

      // Verify recovery restores actual records without altering stored data
      await waitFor(() => document.querySelector('.collection-word') !== null, 4000, 't5-review-recovered');
      const recoveredHero = document.querySelector('.collection-hero');
      assert(!recoveredHero.classList.contains('collection-hero--unavailable'), 'Hero cleared unavailable class');
      assert(recoveredHero.textContent.includes('1 word to review'), 'Hero shows 1 word to review');
      assert(document.querySelector('.collection-word__character').textContent === '爱', 'Restored word 爱 is displayed');

      results.push({ test: 'review-words-read-failure-honesty-and-retry-recovery', passed: true });
      unmountTree();

      // =======================================================================
      // Test 6: SavedWords unreadable collection honesty, retry, and recovery
      // =======================================================================
      db.set('saved_words', [{ id: 'saved-item-1', card_id: 'zh-001', phrase: '八', reading: 'bā', english: 'eight', burmese: 'ရှစ်' }]);

      // Sabotage saved_words read
      localStorage.getItem = function(key) {
        if (key && key.includes('saved_words')) throw new Error('UnreadableSavedDb');
        return origGetItem.apply(this, arguments);
      };

      mountSavedWords();
      await waitFor(() => document.querySelector('.study-error') !== null, 4000, 't6-saved-error-mounted');

      const savedHero = document.querySelector('.collection-hero');
      assert(savedHero.classList.contains('collection-hero--unavailable'), 'Hero has collection-hero--unavailable class');
      assert(savedHero.textContent.includes('Collection unavailable'), 'Hero heading says Collection unavailable');
      assert(!savedHero.textContent.includes('0 saved words'), 'Hero does not report 0 saved words');
      assert(!savedHero.textContent.includes('Start learning'), 'Hero has no Start learning CTA');

      const savedStatus = document.querySelector('.study-section-heading [role="status"]').textContent;
      assert(savedStatus.includes('Status unavailable'), 'Status heading reports Status unavailable');

      const savedAlert = document.querySelector('.study-error[role="alert"]');
      assert(savedAlert !== null, 'Alert container is mounted');
      assert(savedAlert.textContent.includes('Unable to load saved words'), 'Alert mentions unable to load saved words');
      assert(!document.body.textContent.includes('Build your word collection'), 'Does not show empty-state copy');

      // Recover DB and click retry
      localStorage.getItem = origGetItem;
      const savedRetryBtn = savedAlert.querySelector('button');
      savedRetryBtn.click();

      // Verify recovery restores actual saved records
      await waitFor(() => document.querySelector('.collection-word') !== null, 4000, 't6-saved-recovered');
      const recoveredSavedHero = document.querySelector('.collection-hero');
      assert(!recoveredSavedHero.classList.contains('collection-hero--unavailable'), 'Hero cleared unavailable class');
      assert(recoveredSavedHero.textContent.includes('1 saved word'), 'Hero shows 1 saved word');
      assert(document.querySelector('.collection-word__character').textContent === '八', 'Restored word 八 is displayed');

      results.push({ test: 'saved-words-read-failure-honesty-and-retry-recovery', passed: true });
      unmountTree();

      // Send success report
      await fetch('/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ success: true, results }),
      });
    }

    runTests().catch(async (err) => {
      console.error('RUN TESTS ERROR:', err);
      await fetch('/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ success: false, error: err.stack || err.message }),
      });
    });
  </script>
</body>
</html>
